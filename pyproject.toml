[project]
name = "careloop"
version = "0.1.0"
description = "An autonomous administrative agent for family caregivers, built on the Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # Pinned exactly: the spike in docs/spike-findings.md validated cancel_tool, the
    # MultiAgentBase node contract, the async-generator structured_output signature and the
    # Bedrock model-id form against this release. Bump deliberately and re-run the spike.
    "strands-agents==1.51.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Reads the fixture PDFs. A runtime dependency rather than a dev one: the document store is
    # PDF-backed, so extraction is part of the shipped path and not part of the test harness.
    # MIT, pure Python, and its unit of iteration is the page — which is what makes the
    # {source_doc, page} provenance invariant 3 requires structural rather than reconstructed.
    "pdfplumber>=0.11",
    # Serves careloop/api/ — the dashboard's read surface and its three verbs. A runtime dependency
    # rather than a dev one for the same reason pdfplumber is: the API ships as part of the package,
    # not as part of the test harness. It reaches no network of its own and needs no credentials, so
    # CI's zero-secret contract is unaffected.
    "fastapi>=0.115",
    # How careloop/tools/clinic.py reaches Demo World. Declared rather than borrowed: httpx is
    # already in the tree as a strands-agents dependency, and session 4's lesson was that an
    # undeclared dependency you rely on is one you find out about on CI. Session 8 pins the
    # TestClient onto httpx2 for an unrelated starlette deprecation; the two are different
    # distributions providing different modules and do not contend.
    "httpx>=0.27",
    # Verifies the OIDC access token production identity is derived from. A runtime dependency
    # rather than an extra for the reason fastapi and pdfplumber are: careloop/identity/oidc.py
    # ships in the wheel and a production deployment cannot start without it, so an extra would be
    # a step the SSM deploy has to remember. It arrives transitively today via the pinned
    # strands-agents tree, and session 4's lesson was that an undeclared dependency you rely on is
    # one you find out about on CI.
    #
    # The `crypto` extra is what pulls in `cryptography`, which is what RS256 and PyJWKClient need;
    # bare PyJWT can only do HMAC and would fail at the first real token rather than at install.
    # No custom cryptography and no home-grown parser: this library owns signature verification,
    # base64url handling and JWKS caching, and careloop/identity/oidc.py owns only the policy.
    "PyJWT[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    # Writes the fixture PDFs from careloop/tools/document_source.py. In `dev` rather than an
    # extra of its own so CI runs the drift check: "judges can regenerate the documents" is then
    # a tested claim about the committed bytes instead of an aspiration. BSD-3, and its
    # `invariant=1` suppresses the /CreationDate and /ID clocks, which is what makes the
    # regenerated bytes comparable at all.
    "reportlab>=4.0",
    # Required by fastapi.testclient.TestClient, which is how the API is tested: in-process, no
    # socket, no server. In `dev` rather than in the runtime dependencies because nothing under
    # careloop/ imports it — serving the app in anger is uvicorn's job, and that is the deployer's
    # choice rather than this package's.
    #
    # httpx2 rather than httpx: the pinned starlette warns that driving its TestClient with httpx is
    # deprecated. Verified in a clean virtualenv that TestClient works against httpx2 alone and
    # emits no warning, rather than assumed — the alternative was silencing the warning locally
    # while CI, which installs this file and not the local tree, kept emitting it.
    "httpx2>=2.0",
    # Serves Demo World on a loopback port for the clinic tests. In `dev` rather than in the
    # runtime dependencies because nothing under careloop/ imports it — CareLoop is the client
    # here, never the server — but the tests need a real socket: a test client would exercise the
    # ASGI app and skip the one thing this session claims, which is that CareLoop reaches an
    # external system over HTTP. It arrives transitively via strands-agents' mcp dependency today;
    # declared for the same reason httpx is.
    "uvicorn>=0.30",
]

# The model-provider benchmark under bench/ only. Deliberately not part of `dev`: CI installs
# `.[dev]` and must stay able to run with zero secrets and no provider SDK reachable, so the
# packages that can talk to a paid endpoint are not in the path the default suite installs.
bench = [
    # The `openai` extra of the same pinned release, not a looser range. Restating the exact pin
    # means installing the extra can never quietly move strands-agents off the version the spike
    # in docs/spike-findings.md was verified against.
    "strands-agents[openai]==1.51.0",
    # Reads .env into the environment for bench/run.py. Nothing under careloop/ or tests/ imports
    # it — configuration reaches the library as environment variables, never as a file it loads.
    "python-dotenv>=1.0",
]

# The DeepTeam adversarial evaluation under evals/ only. Separate from `bench` and emphatically not
# part of `dev`, for the reason stated above and one more: deepteam resolves deepeval, openai,
# posthog, grpcio and opentelemetry, and CI's "no provider SDK is installed" step is what keeps the
# default suite structurally unable to reach a provider.
#
# The offline half of evals/ — the attack corpus, the replay and the capture layer — imports none of
# this. That is deliberate and is what lets the CI job that prints the headline number install
# `.[dev]` alone. See docs/security-evaluation.md.
evals = [
    # Pinned exactly. docs/spike-findings.md §7 was verified against this release, and §7.3 records
    # that its published defaults and its real ones disagree — a range would let the surface move
    # under findings that were measured against one version.
    "deepteam==1.0.9",
    # NOT a preference. deepteam/telemetry.py imports sentry_sdk at module scope and the
    # distribution does not declare it, so `pip install deepteam==1.0.9` alone produces a package
    # that raises ModuleNotFoundError on import. spike-findings.md §7.1. Remove this the day
    # upstream declares its own dependency, not before.
    "sentry-sdk>=2.0",
    # The same pin `bench` restates, and for the same reason: installing an extra must never
    # quietly move strands-agents off the version the spike was verified against. evals/ reaches
    # NVIDIA over the OpenAI-compatible path for the simulator and the judge.
    "strands-agents[openai]==1.51.0",
]

# AWS-native production tracing for the deployed EC2 host only — see
# docs/adr/0004-agentcore-observability-out-of-band.md. Deliberately not part of `dev`, and
# emphatically not a base dependency, for three separate reasons.
#
# CareLoop must not depend on telemetry to function: the base dependency set is what the
# application needs to *work*, and an observability backend being reachable is not one of those
# things. Second, `check`'s contract is that no provider SDK is reachable, asserted by inspecting
# the installed tree; standing 64 packages in front of that claim is the same reasoning that
# already keeps `bench`, `evals`, `schema`, `frontend` and `e2e` separate. Third, the default suite
# must keep running with nothing installed but `.[dev]` — tests/test_observability.py drives the
# stock OpenTelemetry SDK, which arrives as a hard dependency of strands-agents, so the redaction
# guard is proven without this extra being present anywhere.
#
# Pinned exactly, like `bench` and `evals` restate the strands pin, and for the same reason: a
# range would let an install move the OTel closure off the versions the spike was measured
# against. Measured on a clean install of this pin: 64 packages added, **zero existing versions
# moved** — opentelemetry-api/sdk stay at 1.44.0 and strands-agents stays at 1.51.0, because
# 0.19.0 pins exactly the versions strands-agents already resolves.
observability = [
    "aws-opentelemetry-distro==0.19.0",
]

# Property-based schema testing over careloop/api/ only — tests/test_api_schema.py. Offline and
# $0: schemathesis drives the FastAPI app in-process over ASGI, so there is no server, no port and
# no model call. Separate from `dev` for a reason that is not install size.
#
# schemathesis hard-depends on `pytest>=9,<10` — a runtime dependency of the library, not a test
# extra of ours. Putting it in `dev` would write that `<10` ceiling into the dependency set the
# whole suite resolves, so one module would silently block a future pytest 10 bump for 2492 tests.
# Isolated here, the ceiling applies to the job that needs it and to nothing else.
#
# CI installs `.[dev,schema]` in its own job rather than folding this into `check`. That job's
# contract is "no provider SDK is reachable", asserted by inspecting the installed tree, and
# standing this transitive install (hypothesis, jsonschema, werkzeug, starlette-testclient, rich)
# in front of that claim is the same reasoning that already keeps `frontend` and `e2e` separate.
schema = [
    # Pinned to the release the plan was measured against, with a major-version ceiling. `st run
    # --app` was removed in v4 and the CLI now requires a live server, so the in-process ASGI
    # entrypoint used here — schemathesis.openapi.from_asgi — is the pytest API and nothing else.
    "schemathesis>=4.24.3,<5",
]

# The deployment driver under scripts/ only — `scripts/deploy.py`, `scripts/deploy_artifact.py` and
# `scripts/verify_deploy.py`. Separate from `dev` for the reason every extra above is: CI installs
# `.[dev]` and its contract is that no provider SDK is reachable, asserted by inspecting the
# installed tree. Deploying is also not something the test suite does.
#
# **One package, because that is what the tooling imports.** Measured rather than assumed:
# `deploy_artifact.py` is standard library throughout — `tarfile`, `gzip`, `hashlib`, `subprocess`
# — and `verify_deploy.py` drives the distribution with `urllib`, so `boto3` in `deploy.py` is the
# whole of it. `tests/test_deploy_docs.py` re-derives that set from the modules' own imports, so an
# extra that stopped covering them fails rather than going quietly stale.
#
# **Declared even though it already arrives.** `strands-agents` depends on `boto3<2.0.0,>=1.26.0`,
# so a `.[dev]` checkout has had one all along — which is precisely the shape session 4's `httpx`
# note names: an undeclared dependency you rely on is one you find out about on CI. An operator
# deploying from a checkout should not be depending on the agent SDK's dependency list to have a
# deploy tool, and the day `strands-agents` drops boto3 is not the day to discover that.
#
# **`[crt]` is why this extra exists at all, and it is not decoration.** The first real SSM deploy
# could not start: the `careloop-deployer` profile is an `aws login` profile carrying a
# `login_session`, and botocore's login credential provider raises
# `MissingDependencyException: Using the login credential provider requires an additional
# dependency ... botocore[crt]`. Measured 2026-08-24, against both boto3 and the AWS CLI.
#
# **`boto3[crt]` rather than naming `awscrt`.** The extra resolves `botocore[crt]`, which pins
# `awscrt==0.36.0` itself. Spelling awscrt here would be a second, independent constraint on a
# package botocore already constrains exactly — two answers to one compatibility question, which
# is the shape this repository refuses everywhere else.
#
# The floor is the version the deploy was actually proven on rather than the oldest that might
# work; the ceiling is the major, because boto3 2.x would be a different SDK and deserves a
# deliberate edit. Node is deliberately absent: `build_frontend` shells out to `npm run build`, and
# a Python extra cannot supply it.
deploy = [
    "boto3[crt]>=1.43.68,<2",
]

# No [project.scripts] yet. The `careloop` console script comes back with careloop/cli.py in
# commit 9; declaring it now installs a launcher that fails on invocation for anyone following
# the README.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["careloop*"]

[tool.setuptools.package-data]
careloop = ["policy/*.yaml", "events/fixtures/*.json", "tools/fixtures/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung test must fail the run, not burn the CI budget. The whole suite finishes in under a
# second, so 60s is a runaway detector rather than a performance budget — the loop-bound test
# (T4) has to fail loudly if the graph primitives ever stop bounding the loop.
timeout = 60
# Pinned, not left to the default, because the default is platform-dependent: pytest-timeout uses
# SIGALRM where it exists (Linux) and threads where it does not (Windows). Two reasons to pin to
# thread. It makes a local Windows run and a CI Linux run behave identically, and a thread-based
# timeout cannot be swallowed — the signal method raises an ordinary exception inside the test,
# which a broad `except Exception` in the code under test can catch and turn into a bland failure
# or a retry. Thread dumps every thread's stack and kills the process, which is also what you want
# when diagnosing a deadlock in async graph execution.
timeout_method = "thread"
filterwarnings = ["error::DeprecationWarning:careloop.*"]
# Registered so an unknown-marker warning cannot hide a typo'd mark. Deliberately NOT excluded via
# addopts: `live` tests gate themselves on CARELOOP_LIVE=1 plus a key pair in .env, so CI collects
# them and skips them, and the skip is visible in the run summary. A `-m "not live"` default would
# make them invisible instead, and a test nobody can see being skipped is a test nobody notices has
# stopped existing.
markers = [
    "live: runs against a real paid model provider; skipped unless CARELOOP_LIVE=1 and .env carries credentials",
    "schema: property-based schema testing over the HTTP API; skipped unless the `schema` extra is installed",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# N818 wants an Error suffix on every exception. CareLoop's exceptions are domain vocabulary
# (IllegalTransition, VersionConflict, PromotionForbidden) and read as statements about the
# domain rather than about Python; the suffix adds noise without adding information.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
