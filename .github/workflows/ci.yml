name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run on the same ref tells us nothing; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # **Every job carries a bound, and this is the reason.** GitHub's default is 360 minutes, and
    # on 2026-08-18 the `e2e` job spent all of them: `playwright install --with-deps` blocked
    # inside `apt-get` and nothing was there to stop it, so a transient stall on a step with
    # nothing left to do cost six hours of runner time and reported only "cancelled". A bound does
    # not make anything faster — it makes a hang a *failure*, which is the only thing that can be
    # acted on. Sized as a comfortable multiple of the measured runtime rather than trimmed to it:
    # this is a runaway detector, not a performance budget.
    timeout-minutes: 20

    # No secrets, no credentials, no network calls. The suite runs entirely on the mock model
    # provider, so this job must pass on a fork PR with zero secrets configured. The variables
    # below are not credentials — they exist so that if something in the test path ever starts
    # reaching for a real provider, it fails fast and loudly here instead of hanging on the
    # instance-metadata endpoint or silently succeeding on a developer's configured machine.
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /nonexistent
      AWS_SHARED_CREDENTIALS_FILE: /nonexistent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Single version, no matrix: requires-python is >=3.12 and the Strands pin in
          # pyproject.toml was verified by execution against 3.12 only.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Enforces what the env block above only sets up: this job must run with no provider SDK
      # reachable, so "offline, $0, no secrets" is checked rather than assumed.
      #
      # This is a workflow step and not a pytest test on purpose. The property is about the
      # *installed tree*, and a test asserting `openai` is absent would fail on every developer
      # machine that has the `bench` extra — which is every machine that can run the benchmark.
      # Only CI can assert it, so only CI does.
      #
      # What it protects: `openai` belongs to `bench`, never to `dev`. If it ever leaks into `dev`,
      # the two pytest.importorskip tests in tests/test_llm_providers.py would quietly start
      # running here and this job would stay green while no longer proving anything about
      # reaching a provider. That is a property dying silently on a pyproject.toml edit, which is
      # the same failure mode the no-clock guard was moved to source-level enforcement to avoid.
      #
      # Only `openai` is checked. boto3 arrives as a strands-agents dependency and cannot be
      # excluded; it is also inert without credentials, which the env block above denies it.
      - name: Assert no provider SDK is installed
        run: |
          if python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('openai') else 1)"; then
            echo "::error::'openai' is importable in CI's environment. It belongs to the 'bench' extra, not 'dev'. CI must run with no provider SDK reachable. If this was deliberate, move this assertion rather than deleting it."
            exit 1
          fi
          echo "No provider SDK installed - correct."

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # The form CLAUDE.md documents. The suite collects under bare `pytest` too — no test module
      # imports conftest, so nothing depends on the working directory being on sys.path — but the
      # two are kept identical so a CI failure always reproduces with the documented command.
      - name: Test
        run: python -m pytest -q

  # The adversarial replay. Free, offline, and it prints the number docs/security-evaluation.md
  # quotes — so the claim is re-established on every commit instead of being a figure somebody
  # wrote down once and nobody re-derived.
  #
  # A separate job from `check` for one reason: this one's output is meant to be *read*. A judge
  # opening the Actions log sees the headline and the mutation result side by side, which is not
  # something a line in a 1900-test pytest summary can do.
  #
  # It installs `.[dev]`, never `.[evals]`. The whole design of evals/ is that the offline layer —
  # corpus, targets, capture, replay — imports CareLoop and the standard library and nothing else.
  # The assertion below is what keeps that true: if deepteam ever becomes reachable here, the free
  # layer has quietly acquired a paid dependency and this job stops being free.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same zero-credential contract as `check`. The replay reaches no provider: it drives the graph
    # with a scripted adversarial planner, so a run that somehow started buying calls would fail
    # here rather than succeed quietly.
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /nonexistent
      AWS_SHARED_CREDENTIALS_FILE: /nonexistent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Assert the paid evaluation extra is not installed
        run: |
          if python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('deepteam') else 1)"; then
            echo "::error::'deepteam' is importable in this job's environment. The offline replay must run on '.[dev]' alone. If the offline layer now needs it, that is a design change, not a CI fix."
            exit 1
          fi
          echo "deepteam is absent - correct."

      # Exit codes carry the meaning: 1 = an unauthorised action occurred, 2 = the allow-all
      # mutation changed nothing so the zero was never measuring the gate, 3 = the corpus is empty.
      # A green tick here means both halves held.
      - name: Adversarial replay and vacuity proof
        run: python -m evals.replay

      # CareLoopBench's quick tier, in this job rather than a fifth one — for the reason this job
      # exists. Its output is meant to be *read*: a judge opening the Actions log sees the
      # adversarial headline above and, immediately below it, how many of CareLoop's declared
      # properties this commit actually proved and which live proofs certify which commit.
      #
      # `quick` and not `core`: the real-protocol proofs bind loopback sockets and fork child
      # processes, and the `check` job already runs every one of them as part of the whole suite.
      # What this adds is the *counting*, not a second execution.
      #
      # `--check` fails on FAILED and on nothing else. A live proof that has gone STALE is a true
      # statement about a proof that stopped being about this code, not a breakage, and a tier that
      # did not touch a claim has discovered nothing about it either. Neither may redden a build.
      #
      # This does not replace `pytest -q`. It runs a curated ~1 200-test subset selected by the
      # claim registry; the `check` job remains the full-repository regression gate.
      - name: CareLoopBench, quick tier
        run: python -m careloopbench --tier quick --check

  # Property-based schema testing over the HTTP API — tests/test_api_schema.py. Offline and $0: the
  # FastAPI app is driven in-process over ASGI, so there is no server, no port and no model call.
  #
  # **A separate job rather than a step in `check`, for `check`'s own reason.** That job's contract is
  # that no provider SDK is reachable, and it asserts it by inspecting the installed tree. Schemathesis
  # brings hypothesis, jsonschema, werkzeug, starlette-testclient and rich with it, and standing that
  # install in front of a claim about what is importable is the same reasoning that already keeps
  # `frontend` and `e2e` out of `check`.
  #
  # It also installs `.[dev,schema]`, which is the only job that does. The `schema` extra is kept out
  # of `dev` because Schemathesis hard-depends on `pytest>=9,<10`: in `dev` that ceiling would apply
  # to the whole suite, so one module would block a future pytest 10 bump for 2500 tests.
  #
  # **This blocks, from day one**, the same as `e2e` and for the reason written there: a report-only
  # suite decays into noise, and a guard which cannot fail proves nothing.
  #
  # Note what stays green in `check` regardless: tests/test_schema_checks.py holds the response-sweep
  # property as pure predicates importing no Schemathesis, so `check` covers it and this job adds the
  # fuzzing over every declared operation on top.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The same zero-credential contract as every other Python job here.
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /nonexistent
      AWS_SHARED_CREDENTIALS_FILE: /nonexistent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,schema]"

      # The counterpart of `check`'s assertion, in the other direction: that job proves the extra is
      # absent by never installing it, and this one must prove it is *present*. Without this, a
      # resolution failure would leave pytest.importorskip skipping the whole module and the job
      # would go green having tested nothing — which is precisely the silent-death failure mode the
      # visible skip was chosen to avoid.
      - name: Assert Schemathesis is installed
        run: |
          if ! python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('schemathesis') else 1)"; then
            echo "::error::'schemathesis' is not importable, so tests/test_api_schema.py would skip and this job would pass without testing anything. Fix the 'schema' extra rather than deleting this assertion."
            exit 1
          fi
          echo "Schemathesis is present - correct."

      # Only this file. The rest of the suite is `check`'s job and running it twice buys nothing.
      - name: Schema tests
        run: python -m pytest tests/test_api_schema.py -q

  # A separate job rather than a step in `check`, deliberately. The Python job's whole contract is
  # that it runs with no credentials and no provider SDK reachable, and adding a Node toolchain to
  # it would put that claim behind an unrelated install. The two share nothing: `pyproject.toml`
  # sets `testpaths = ["tests"]` so pytest never descends into `frontend/`, and ruff lints Python.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the build was verified against locally. No matrix: one frontend ships.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci`, not `install`: the lockfile is the record of what the build was verified against,
      # and a job that could resolve a different tree would not be checking the shipped one.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Last, because a build that succeeds while the types or the tests fail tells us nothing.
      - name: Build
        run: npm run build

  # End to end, against a real backend. The gap this closes: every one of the `frontend` job's 119
  # tests replaces the network with `vi.stubGlobal("fetch", …)` and asserts against fixtures the
  # frontend authored, so a backend field rename leaves them green and the demo broken. jsdom also
  # has no navigation and no origin server, so no test above can express a routing defect, and
  # axe's `color-contrast` rule is documented as non-functional there.
  #
  # **This blocks, from day one.** A report-only suite decays into noise, and the whole position of
  # this repository is that a guard which cannot fail proves nothing. It is deterministic by
  # construction: loopback only, scripted agents, no model provider, no CDN.
  #
  # It needs both toolchains, which is exactly why it is not a step in `check` or in `frontend` —
  # adding Node to the Python job would put its zero-provider claim behind an unrelated install.
  #
  # The deployed project is **not** run here. It spends real Bedrock tokens and depends on a live
  # host, so it is `npm run test:deployed`, by hand or on a schedule, and it never gates a merge.
  e2e:
    runs-on: ubuntu-latest
    # Two toolchains, a browser, a bundle and two servers, so the widest of the five — and the
    # one that proved a bound was needed.
    timeout-minutes: 30

    # The same zero-credential contract as `check` and `evals`. The harness binds scripted agents,
    # so a run that somehow started reaching a provider fails here rather than succeeding quietly.
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /nonexistent
      AWS_SHARED_CREDENTIALS_FILE: /nonexistent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          # Matching the `frontend` job. Playwright 1.62 requires Node >= 20.
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install CareLoop
        run: pip install -e ".[dev]"

      - name: Install the e2e suite
        working-directory: e2e
        run: npm ci

      # Keyed on the lockfile, which is what pins the Playwright version and therefore the browser
      # build. A miss downloads (~150 MB) rather than failing — the only step here that is not
      # offline, stated so it is never discovered rather than expected.
      - name: Cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # **The browser, and deliberately no longer `--with-deps`.**
      #
      # That flag switches to root and runs `apt-get update` and `apt-get install` on *every* run,
      # cache hit or not — and on 2026-08-18 it stopped there. The log ends mid-`apt-get`, six
      # hours before GitHub cancelled the job, on a step whose browser was already restored from
      # the cache above and which therefore had nothing left to do. That is the ordinary way apt
      # fails on a hosted runner: it blocks on the dpkg lock `unattended-upgrades` holds, and apt
      # waits for it forever by default.
      #
      # The flag also buys nothing here. GitHub's Ubuntu image ships Chrome and Edge, so every
      # package in Playwright's chromium list is already installed; `--with-deps` was paying an
      # `apt` round trip, and the risk of one, to install what is present. On a bare container it
      # would still be the right flag — this repository does not run one.
      #
      # Rather than assume any of that, the next step proves it, and repairs it if it ever stops
      # being true.
      - name: Install Chromium
        working-directory: e2e
        timeout-minutes: 10
        run: npx playwright install chromium

      # The claim above, checked in about a second, and repaired rather than merely reported.
      #
      # A missing system library makes every one of the hundred-odd tests below fail together with
      # the same opaque message; here it is one line naming the package, before anything else runs.
      # The repair path is the `apt` work that used to be unconditional, now taken only when it is
      # genuinely needed — and bounded twice, by `DPkg::Lock::Timeout` so apt gives up on a lock
      # somebody else holds instead of waiting out the job, and by this step's own limit so that a
      # stall anywhere in it is a failure in ten minutes rather than a cancellation in six hours.
      #
      # `install-deps` is called without `sudo`: Playwright escalates on its own, which is what the
      # "Switching to root user to install dependencies..." line in that cancelled log was.
      - name: Prove Chromium launches, and install its system libraries only if it cannot
        working-directory: e2e
        timeout-minutes: 10
        run: |
          launches() {
            node -e "require('playwright').chromium.launch().then(b => b.close()).catch(e => { console.error(e.message); process.exit(1); })"
          }
          if launches; then
            echo "Chromium launches on this runner as shipped; no system libraries needed."
            exit 0
          fi
          echo "Chromium could not launch. Installing the system libraries it names."
          sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 update
          npx playwright install-deps chromium
          launches

      # The harness serves this from the API's own origin, which is what keeps the browser
      # same-origin against `/api` with no CORS middleware anywhere. It refuses to start without it.
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      # Starts Demo World and CareLoop itself — see e2e/playwright.config.ts.
      - name: Test
        working-directory: e2e
        run: npx playwright test

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
