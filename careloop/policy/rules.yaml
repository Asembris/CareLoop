# CareLoop policy rules.
#
# The engine, not this file, fixes the match order: explicit DENY, then REQUIRE_HUMAN, then
# ALLOW, then a default DENY. Ordering is not configurable here because a rules file that can
# reorder its own precedence can be talked into promoting an ALLOW above a DENY.
#
# Within one effect, the first matching rule wins, so file order matters among rules of the same
# effect and nowhere else.
#
# `diagnostic` is timeline-only and may say anything. `reason_code` is the only thing the planner
# ever sees, it must be a member of careloop.policy.verdicts.ReasonCode, and it is never
# interpolated. Argument classes are asserted here and owned by careloop/tools/registry.py; a rule
# that contradicts the registry fails at load.

version: 1

rules:
  # ---------------------------------------------------------------------------------------------
  # DENY — evaluated first, in this order.
  # ---------------------------------------------------------------------------------------------

  # The state gate goes first: "you should not be doing this yet" is a more fundamental objection
  # than anything about the arguments, and it keeps argument-level diagnostics out of the timeline
  # for calls that were never going to be considered.
  #
  # PLANNING is included in the permitted set because the planner proposes from there and must be
  # able to receive REQUIRE_HUMAN rather than a state denial. AWAITING_HUMAN is excluded: while a
  # decision is outstanding, no further external effect may be proposed.
  - id: deny-external-effect-outside-execution-states
    effect: DENY
    tools: [send_email, book_appointment, upload_document, grant_portal_access]
    when:
      case_state_not_in: [PLANNING, READY_TO_EXECUTE, EXECUTING]
    reason_code: WRONG_CASE_STATE
    diagnostic: >-
      External effect proposed from a case state that does not permit one. Legitimate states are
      PLANNING (proposal), READY_TO_EXECUTE and EXECUTING.

  # The injection case. `to` is DESTINATION-class, so no amount of validation can raise a
  # document-sourced address to TRUSTED; a recipient that did not come from trusted configuration
  # is denied whether it reads as plausible or not.
  - id: deny-email-to-untrusted-recipient
    effect: DENY
    tools: [send_email]
    when:
      arg_trust_below:
        - arg: to
          level: TRUSTED
          arg_class: DESTINATION
    reason_code: DESTINATION_NOT_TRUSTED
    diagnostic: >-
      send_email.to resolved below TRUSTED. DESTINATION-class arguments are not promotable by
      validation; the address must come from trusted config or an explicit human decision.

  - id: deny-upload-to-untrusted-portal
    effect: DENY
    tools: [upload_document]
    when:
      arg_trust_below:
        - arg: portal_id
          level: TRUSTED
          arg_class: DESTINATION
    reason_code: DESTINATION_NOT_TRUSTED
    diagnostic: >-
      upload_document.portal_id resolved below TRUSTED. A portal named by document content is not
      a legitimate upload target however well-formed the identifier looks.

  - id: deny-portal-access-to-untrusted-grantee
    effect: DENY
    tools: [grant_portal_access]
    when:
      arg_trust_below:
        - arg: grantee
          level: TRUSTED
          arg_class: DESTINATION
    reason_code: DESTINATION_NOT_TRUSTED
    diagnostic: >-
      grant_portal_access.grantee resolved below TRUSTED. Who receives access is DESTINATION-class
      and must come from trusted config or a human decision.

  # The only rule keyed on the system's only AUTHORITY argument. It is the mirror of the
  # destination rules: a role lifted out of a document and then validated is still CONTROLLED, and
  # CONTROLLED is below TRUSTED, so the grant is denied. Validation cannot manufacture authority.
  - id: deny-authority-grant-below-trusted
    effect: DENY
    tools: [grant_portal_access]
    when:
      arg_trust_below:
        - arg: role
          level: TRUSTED
          arg_class: AUTHORITY
    reason_code: AUTHORITY_NOT_TRUSTED
    diagnostic: >-
      grant_portal_access.role resolved below TRUSTED. This is NOT the not-yet-validated case that
      INSUFFICIENT_FACT_TRUST covers: AUTHORITY-class arguments are absent from
      PROMOTABLE_ARG_CLASSES, so no validator can ever raise one, and revalidating this value would
      change nothing. What powers a grant confers must come from trusted config or a human
      decision. Contrast deny-booking-on-unvalidated-slot, where validation is the remedy.
      Note that promotion was never the only way in. Trust is resolved against the fact key the
      argument declares (role), and until it was, naming the configured portal id as a role
      resolved TRUSTED by collision and walked past this rule with no promotion involved at all.
      Nothing in CareLoop records a fact under the role key, so this rule now refuses every grant
      the shipped configuration can produce.

  - id: deny-booking-on-unvalidated-slot
    effect: DENY
    tools: [book_appointment]
    when:
      arg_trust_below:
        - arg: slot_start
          level: CONTROLLED
          arg_class: VALUE
    reason_code: INSUFFICIENT_FACT_TRUST
    diagnostic: >-
      book_appointment.slot_start resolved below CONTROLLED. Unlike the AUTHORITY case above, this
      is remediable: slot_start is VALUE-class and therefore promotable, so a time lifted from a
      document becomes usable once a deterministic validator has passed it.

  # ---------------------------------------------------------------------------------------------
  # REQUIRE_HUMAN — evaluated only when no DENY matched.
  # ---------------------------------------------------------------------------------------------

  # Every outbound email is a caregiver decision, even to an address that came from trusted
  # configuration: the recipient being approved says nothing about the body being right.
  #
  # `args_approved: false` is what stops this rule firing forever. Policy is evaluated twice — once
  # to route the proposal while the case is PLANNING, once at the tool boundary while it is
  # EXECUTING — and without the clause the caregiver's decision would be met by a second
  # REQUIRE_HUMAN and the action could never happen. The approval is matched on the canonical
  # argument digest, so it authorises one specific call and not the tool in general.
  - id: require-human-for-outbound-email
    effect: REQUIRE_HUMAN
    tools: [send_email]
    when:
      args_approved: false
    reason_code: REQUIRES_HUMAN_APPROVAL
    diagnostic: >-
      Outbound email always requires an explicit caregiver decision. A TRUSTED recipient bounds who
      can be reached, not what is said to them. Once a caregiver has approved these exact
      arguments, allow-approved-outbound-email takes over.

  - id: require-human-for-authority-grant
    effect: REQUIRE_HUMAN
    tools: [grant_portal_access]
    when:
      args_approved: false
    reason_code: REQUIRES_HUMAN_APPROVAL
    diagnostic: >-
      Granting portal access is an authority change and is never autonomous, whatever the grantee
      and role resolved to.

  # ---------------------------------------------------------------------------------------------
  # ALLOW — the autonomous path. Reached only when nothing above matched.
  #
  # PLANNING is in every permitted set below, matching deny-external-effect-outside-execution-
  # states above. It was missing until commit 6 and that was a bug rather than a policy choice:
  # the DENY rule's own comment says the planner proposes from PLANNING and must be able to
  # receive a real verdict there, but with PLANNING absent here an evaluation in that state could
  # never reach an ALLOW and fell through to the default deny. A legitimate booking was refused
  # NO_RULE_MATCH for no reason a diagnostic explained. The two evaluation points are the routing
  # check while the case is PLANNING, and the tool boundary once it is EXECUTING; both must be
  # able to reach every verdict the rule intends.
  # ---------------------------------------------------------------------------------------------

  - id: allow-booking-on-validated-slot
    effect: ALLOW
    tools: [book_appointment]
    when:
      case_state_in: [PLANNING, READY_TO_EXECUTE, EXECUTING]
      arg_trust_at_least:
        - arg: provider_id
          level: TRUSTED
          arg_class: DESTINATION
        - arg: slot_start
          level: CONTROLLED
          arg_class: VALUE
      args_present: [patient_id]
    diagnostic: >-
      Booking against a provider from trusted config, at a validated time, with the case cleared
      for execution. This is the autonomous path.

  - id: allow-upload-to-trusted-portal
    effect: ALLOW
    tools: [upload_document]
    when:
      case_state_in: [PLANNING, READY_TO_EXECUTE, EXECUTING]
      arg_trust_at_least:
        - arg: portal_id
          level: TRUSTED
          arg_class: DESTINATION
        - arg: document_id
          level: CONTROLLED
          arg_class: VALUE
    diagnostic: >-
      Upload to a portal from trusted config, of a document whose identifier has been validated.

  # The other half of the human-in-the-loop pair. Reached only after a caregiver approved these
  # exact arguments, and still strictly weaker than every DENY rule above — which is the property
  # worth stating plainly: **an approval cannot launder an untrusted destination.**
  # deny-email-to-untrusted-recipient is evaluated first and unconditionally, so an email to an
  # address that did not come from trusted configuration is refused whether a human approved it or
  # not. In practice the question is never put to a human at all: the gate only requests a decision
  # when the verdict is REQUIRE_HUMAN, and a poisoned recipient never gets that far.
  - id: allow-approved-outbound-email
    effect: ALLOW
    tools: [send_email]
    when:
      case_state_in: [PLANNING, READY_TO_EXECUTE, EXECUTING]
      args_approved: true
      arg_trust_at_least:
        - arg: to
          level: TRUSTED
          arg_class: DESTINATION
    diagnostic: >-
      Email to a recipient from trusted config, with these exact arguments approved by a caregiver.
      The DENY rules ran first and did not match, so the recipient was already TRUSTED before the
      approval was consulted.

  - id: allow-approved-portal-access-grant
    effect: ALLOW
    tools: [grant_portal_access]
    when:
      case_state_in: [PLANNING, READY_TO_EXECUTE, EXECUTING]
      args_approved: true
      arg_trust_at_least:
        - arg: grantee
          level: TRUSTED
          arg_class: DESTINATION
        - arg: role
          level: TRUSTED
          arg_class: AUTHORITY
    diagnostic: >-
      Access grant to a grantee and with a role that both came from trusted config, approved by a
      caregiver. Unreachable for anything a document named: role is AUTHORITY-class and absent from
      PROMOTABLE_ARG_CLASSES, so a role lifted from evidence can never resolve TRUSTED and
      deny-authority-grant-below-trusted refuses it before this rule is considered.
      It is in fact unreachable full stop under the shipped configuration, because no producer
      anywhere records a fact under the role key: TRUSTED_CONFIG declares caregiver_email,
      provider_id and portal_id and nothing else. That is deliberate and is left as it stands. The
      rule is kept because it states what a legitimate grant would require, and because inventing a
      trusted role purely to restore reachability would be manufacturing authority to satisfy a
      symmetry nobody asked for. Pinned by
      tests/test_typed_trust.py::TestTheGrantPathHasNoProductionAuthority.

  # fetch_document has no external effect, but deny-by-default applies to every tool call, so the
  # read path needs a rule of its own or nothing could read a document at all.
  #
  # **The state clause is what session B added, and it is the whole point of this rule now.** The
  # rule used to be unconditional, justified as "or the planner can never gather evidence". That
  # premise is false in the built system: the evidence node reads every attached document
  # deterministically, while the case is GATHERING_EVIDENCE, *before* the planner is ever called —
  # session 5 decided extraction is deterministic and invariant 1's second sentence is why. By the
  # time the planner runs there is nothing left for it to fetch.
  #
  # What the unconditional rule actually enabled was measured. Given a poisoned case where every
  # effectful proposal had been refused, the live planner proposed fetch_document as its next move
  # in 7 of 23 runs — avoidance rather than evidence-gathering, the model reaching for the one call
  # it had not yet been refused. Restricting the rule to GATHERING_EVIDENCE keeps the deterministic
  # read path working and leaves the planner, which proposes from PLANNING, with no rule to match:
  # deny-by-default refuses it NO_RULE_MATCH, which is the honest answer.
  #
  # Expressed as a condition rather than as a check in the gate node, because invariant 2 says a
  # rule is never encoded in Python — and "who is calling" is not a thing the engine knows, whereas
  # "what state is the case in" is exactly what it already reasons about.
  - id: allow-document-fetch-while-gathering-evidence
    effect: ALLOW
    tools: [fetch_document]
    when:
      case_state_in: [GATHERING_EVIDENCE]
      args_present: [document_id]
    diagnostic: >-
      Reading a document CareLoop already holds has no effect outside the system. Permitted only
      while the case is GATHERING_EVIDENCE, which is the deterministic evidence node's window; a
      planner proposing it from PLANNING matches no rule and is refused.
