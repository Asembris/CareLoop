[project]
name = "careloop"
version = "0.1.0"
description = "An autonomous administrative agent for family caregivers, built on the Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "strands-agents>=1.51.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.scripts]
careloop = "careloop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["careloop*"]

[tool.setuptools.package-data]
careloop = ["policy/*.yaml", "events/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = ["error::DeprecationWarning:careloop.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# N818 wants an Error suffix on every exception. CareLoop's exceptions are domain vocabulary
# (IllegalTransition, VersionConflict, PromotionForbidden) and read as statements about the
# domain rather than about Python; the suffix adds noise without adding information.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
