<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CareLoop</title>
    <!-- Blocking on purpose, and before any stylesheet: the theme class must be on <html> when
         the first frame paints, or a dark-theme visitor gets one ivory flash on every load. The
         stored choice wins; with nothing stored, the system preference decides. Kept in sync with
         useTheme (same key, same rule) — this script decides the first frame, the hook every one
         after it.

         Two forms of the same fact, and the app remains the single source of truth for it. The
         `dark` class is what every token in tokens.css keys off. `data-theme` carries the same
         decision in the form the motion field reads: it watches the first `[data-theme]` element
         and retones on mutation, so `<html>` — first in document order — is where both live.
         `light` is written explicitly rather than left implied, because the field's observer
         reads an attribute value and an absent attribute is not a value. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("careloop:theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (error) {
          /* No storage access means light, which is the canonical theme anyway. */
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- The three families are self-hosted from /fonts and declared in src/styles/fonts.css.
         Nothing here reaches a CDN: a demo filmed in fallback faces because the network hiccuped
         would lose most of what the design is. -->
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- The orchestration field paints here, behind the whole application: paper (html/body) →
         field (z-index 0) → app (#root, z-index 1). Static markup rather than a React element on
         purpose — the module re-boots itself whenever this canvas leaves the document, and a
         canvas React owns would hand that guard every StrictMode double-mount to interpret.

         Positioning is inline rather than in global.css because the stylesheet arrives with the
         bundle: an unstyled canvas is a 300x150 inline-block, and it would be one at the top of
         the page for exactly as long as the CSS takes to land. Decorative and inert — aria-hidden,
         and `pointer-events: none` so it can never take a click meant for the interface. -->
    <canvas
      id="careloop-field"
      aria-hidden="true"
      style="position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block"
    ></canvas>

    <div id="root"></div>

    <!-- The boot choreography: an SVG loader that paints the orchestration story assembling
         itself, then hands its central mark to the header's real one. See docs/BOOT.md.

         A **classic** script, and parser-inserted rather than injected. Both halves matter. A
         classic script runs synchronously at this point in the parse, so the loader exists before
         the application module is evaluated and before any WebGL context is created — a script
         appended from JS would be async, and an entrance that arrives whenever the network
         finishes is not an entrance. And a classic `src` pointing at a `public/` file is left
         alone by Vite: `buildHtmlPlugin` rewrites the path and stops there, bundling only
         `type="module"` sources that are not public files. Verified against vite 5.4 rather than
         assumed, because the failure would be silent.

         The loader decides for itself whether to run — `?boot=off` sticky for the tab, once per
         tab otherwise, `?boot=on` and `?boot=full` to replay. That policy lives with the loader
         because it is the loader's, and because a kill switch split across two files is one
         somebody eventually half-changes. -->
    <script src="/careloop-boot.js"></script>

    <!-- The reaper: the second, independent guarantee that the loader cannot trap CareLoop.
         **It holds no reference to the loader** — not the controller, not the class, not a
         callback. It reads the DOM the loader leaves behind and undoes exactly that, which is
         what makes it a real second enforcement point rather than a second call into the same
         code. It covers what the loader's own teardown structurally cannot: a build that throws
         after the overlay is mounted, a `finalize()` a future edit breaks, an exit that never
         reaches its own timer.

         It arms only when the loader actually mounted, which it asks by looking for `data-booting`
         — set synchronously by the script above, so this is already decided by the time this runs.
         A loader that 404s, is blocked, or dies at parse leaves no attribute, no overlay and
         nothing to reap.

         Twelve seconds: the loader's own hard readiness timeout is nine, plus its exit. This is
         the outer bound, not the working one. -->
    <script>
      (function () {
        var html = document.documentElement;
        if (!html.hasAttribute("data-booting")) return;

        function reap() {
          try {
            var hidden = document.querySelectorAll("[data-boot-hidden]");
            for (var i = 0; i < hidden.length; i++) {
              hidden[i].style.opacity = "";
              hidden[i].removeAttribute("data-boot-hidden");
            }
            var flier = document.querySelector("[data-boot-flier]");
            if (flier) flier.remove();
            var overlay = document.getElementById("careloop-boot");
            if (overlay) overlay.remove();
            html.removeAttribute("data-booting");
          } catch (error) {
            /* Nothing above can be retried usefully, and throwing here would be the cosmetic
               layer taking the application down at the last possible moment. */
          }
        }

        var timer = setTimeout(reap, 12000);
        window.addEventListener("careloop:booted", function () { clearTimeout(timer); }, { once: true });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <!-- The field is an enhancement and is loaded as one: injected after the application's own
         module, never bundled with it, and skipped entirely when it is not wanted.

         `?motion=off` is the kill switch — a debugging lever and a fail-open one. It removes the
         canvas and never fetches three.js, so what remains is the application exactly as it was
         before this layer existed. The scene has its own fallbacks for a missing WebGL context or
         a failed fetch (it hides the canvas and warns), so this is the switch for the case where
         nothing failed and the field is simply not wanted.

         Injected rather than written as a `<script type="module" src="/careloop-scene.js">` tag:
         Vite resolves script srcs in this file as build inputs, and `/careloop-scene.js` is a
         `public/` file that must be copied verbatim rather than bundled. -->
    <script>
      (function () {
        var off = false;
        try {
          off = new URLSearchParams(window.location.search).get("motion") === "off";
        } catch (error) {
          /* No URLSearchParams means an environment the field will not run in anyway. */
        }
        if (off) {
          var canvas = document.getElementById("careloop-field");
          if (canvas) canvas.remove();
          return;
        }
        var field = document.createElement("script");
        field.type = "module";
        field.src = "/careloop-scene.js";
        document.body.appendChild(field);
      })();
    </script>
  </body>
</html>
