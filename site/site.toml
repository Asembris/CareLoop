# The one edit surface for the CareLoop dossier.
#
# Everything here is substituted into a copy of `vendor/dossier.bundle.html` by `adapt.py`, which
# writes `index.html`. Never edit `index.html` and never edit the vendored bundle: the first is
# generated, and the second is the pristine Claude Design artifact whose embedded rendering
# manifest is the fidelity surface this whole arrangement exists to protect.
#
# **Empty means pending, and pending is a designed state.** The dossier renders `—` with
# "Verified result pending" for an empty result, and "Deployment pending" / "Repository pending"
# for an empty destination, falling back to an in-page anchor rather than a dead link. Leaving a
# value empty is therefore always safe; filling one with a guess is not.

[site]
# Absolute origin the deployed site answers on, with no trailing slash — for example
# "https://asembris.github.io/CareLoop". Empty until GitHub Pages is actually live.
#
# While it is empty, `canonical`, `og:url` and the absolute form of `og:image` are omitted and the
# social image is emitted as a page-relative path instead. A relative `og:image` resolves correctly
# for a browser and for any crawler that resolves relative URLs, and it is honest: it claims no
# address this site does not yet have. Filling this in is a Phase-2 step that happens after the
# first successful deployment, not before it.
pages_base_url = ""

# The dossier's own copy, lifted verbatim from its `<helmet>` block so the crawler-visible head and
# the hydrated head say the same thing. These are not new marketing lines; changing them here
# changes only what a crawler sees, which is why they live beside the tags they populate.
title = "CareLoop — Agency with boundaries. Care with receipts."
description = "CareLoop proposes actions, checks authority against deterministic policy, executes only what is permitted, and re-reads the clinic's own record before a booking is called done."
og_title = "CareLoop — Agency with boundaries. Care with receipts."
og_description = "An autonomous back office for family caregiving. The loop is only closed when the world agrees."

# Loose files, because a social crawler cannot reach an image that only exists base64-encoded
# inside the bundle's manifest. Page-relative on purpose: a leading slash would 404 under the
# GitHub project path `/<repo>/`.
og_image = "assets/product/authority.png"
favicon = "assets/careloop-mark.svg"

# Where the dossier's calls to action point. All four are read by the page's own PROJECT object,
# and only the ones the repository can defend are filled.
#
# `live_url` is the deployed application, recorded in README.md, docs/judges.md and the hourly
# probe in .github/workflows/demo-health.yml. It is filled because `scripts/verify_deploy.py`
# passes against it end to end — the referral scenario reaches DONE and the booking is read back
# from the clinic and matched — rather than because the host merely answers 200.
#
# `github_url` is this repository's own remote. **It resolves publicly only once the repository is
# public**, which it is not yet; until then the CTA is a link a judge cannot follow. That is a
# visibility decision rather than a wrong value, and it is the reason the evidence SOURCE rows are
# still left pending.
#
# `video_url` is the submitted demo film. Filling it needs no markup change: the bundle already
# carries the conditional, so the demo panel stops being a same-page jump, "Demo film coming soon"
# is replaced by "Play film" and both open the film in a new tab.
#
# `devpost_url` stays empty, and the reason is not that the entry is missing — the submission
# exists. **No markup reads it.** `devpostUrl` occurs twice in the page, as a prop declaration and
# as a `PROJECT` field, and nothing consumes either, so a value here would render nowhere and only
# claim a call to action the design does not have. Adding one means new markup in the vendored
# bundle, which is the fidelity surface and may not be rebuilt here. The Devpost entry is exposed
# from README.md instead, and this stays empty until the page has somewhere to put it.
[destinations]
live_url = "https://d2heuwvhvrdyig.cloudfront.net"
github_url = "https://github.com/Asembris/CareLoop"
devpost_url = ""
video_url = "https://youtu.be/d96tKDk2p-M"

# The six proof-ledger results, by their id in the page's EVIDENCE array.
#
# **A number goes here only when the repository can produce it on demand**, and only under a label
# that describes what was actually measured. An empty string leaves the entry reading `—` /
# "Verified result pending", which is the honest state and was the one Phase 1 shipped.
#
# Filled in session W, each against a command a reader can run:
#
#   unauthorized  python -m evals.replay            offline, $0, ~1s, no credentials
#   mutation      the same command, second target   the allow-all mutant it prints beside it
#   injection     scripts/verify_lock.py            13 runs of the poison-only scenario, 2026-08-19
#   readback      tests/test_verify_readback.py     four booking fields, one mutant each
#   e2e           scripts/verify_lock.py            25 deployed runs, 2026-08-19
#   tests         python -m pytest --collect-only   offline, on the mock provider, $0
#                                                   (a floor over the base `.[dev]` install)
#
# **`tests` is a floor rather than a count, and that is the second correction this row has had.**
# It read `2720 passed` while the suite collected more than twice that. It was then derived from
# pytest's own collection and read `6183 collected` -- and drifted to 6190 across five commits
# whose only Python change was none at all. Three copy sweeps (`tests/test_recovery_copy.py`,
# `tests/test_upload_vocabulary.py`, `tests/test_adversarial_copy.py`) parametrise one case per
# swept file over `frontend/src/**`, so adding one React component and two Vitest files added seven
# collected Python tests. The sweeps are right; the *published exact figure* is what is wrong,
# because it can be falsified by a frontend change nobody would think to re-derive it after.
#
# So the claim is weakened until it is stable. A floor is true of every commit that does not delete
# a quarter of the suite, and it cannot overclaim, because by construction it claims less than the
# truth. `tests/test_published_evidence.py` asserts only that pytest really collects at least this
# many -- **no upper bound**, because a ceiling would be a second magic number whose failure mode is
# a suite that grew. The exact figure stays derivable on demand (`pytest --collect-only`, and
# CareLoopBench's own `tests executed` line); it is simply not published, because nothing a reader
# decides turns on its last two digits.
#
# It is reliability *metadata* and is deliberately no part of any CareLoopBench domain -- a total
# test count says how much there is, never that any particular property holds.
#
# **The count is taken over the base `.[dev]` install, and the reason is a failure worth recording.**
# The first version of this row asserted a bare `pytest --collect-only` and went red on CI within
# the hour: a machine carrying the optional `schema` extra collects `tests/test_api_schema.py` and
# 31 tests more than the `check` job does. A published figure that depends on which extras a reader
# happens to have installed is not a measurement of this repository, so the check excludes the
# modules an extra gates at collection time -- found structurally, by AST, so a second one cannot
# appear unnoticed. `tests/test_llm_providers.py` is deliberately *not* excluded: its two
# `importorskip` calls sit inside test bodies, so it is collected either way.

# **Every other row is derived too, and two deliberately are not.** `unauthorized` and `mutation`
# come from `evals.replay`'s own report, `readback` from the size of the verifier's own comparison
# map. `injection` and `e2e` are measurements against the *deployed* demo on 2026-08-19: they cost
# real model calls and cannot be reproduced offline, so they are named in that file's
# `OPERATOR_MEASURED` table with the tool and the day that produced them rather than given an
# offline substitute that would be worth less than the honest absence of one.

# **`e2e` is `24 of 25` and not `25 of 25`, deliberately.** One resume run ended FAILED because the
# model failed twice running to form a proposal satisfying its own schema. Nothing unsafe happened
# and nothing was performed, but it is a real outcome and the entry's own caveat line says what it
# was. Publishing the round number would be the exact dishonesty this ledger exists to refuse.
[evidence]
unauthorized = "0 of 320"
injection = "0 of 13"
mutation = "320 of 320"
readback = "4 of 4"
e2e = "24 of 25"
tests = "6,000+"

# The two rows of the boundary-removed counterfactual. Empty keeps the pristine em dash.
[counterfactual]
careloop = "0 of 320"
boundary_removed = "320 of 320"


# Source receipts — where each claim on the page can be checked in the repository.
#
# **Enabled, and pinned to the submitted executable release.** It was off for as long as the
# repository was private, because a receipt rendered then would have been a link a judge cannot
# open: a 404 under a claim is worse than no link at all, and worse than the page's own honest
# "Source pending". The switch was a two-value change and touched no markup — every mapping below
# was already written and already validated against the working tree, so all the flip added was
# the ability to resolve.
#
# While `enabled` was false `adapt.py` emitted nothing, and the generated page was byte-identical
# to one built with this whole section deleted. That equivalence is still asserted by
# `tests/check_site.py` against a disabled copy of this config, because it is what proves the
# switch is the only thing that can ever make a receipt appear.
#
# **`sha` is the frozen executable release F, and deliberately not the evidence commit that
# publishes this page.** The receipts cite implementation paths, and those paths are byte-identical
# between the two: the later commit adds recorded live proofs, the generated evidence pair and this
# file, and changes no executable surface. Pinning the commit that merely *carries the citation*
# would be self-referential and says less about what a judge is running than naming the build that
# is actually deployed — which `/release.json` independently reports as this same value.
#
# `adapt.py` refuses to build a receipt with an empty `sha` rather than falling back to a branch
# name: `blob/main` moves, and a receipt that drifts off the line it was citing is a false citation
# with a working link, which is the worst of both.
[source_receipts]
enabled = true
sha = "199f09a422c783c6d63f142f8e225ed9acdc9352"
repo = "https://github.com/Asembris/CareLoop"

# Subsystem receipts, keyed by the `atlas` id the page's SYSTEMS array uses.
#
# These render in the architecture inspector's SOURCE row, which the design draws as **text, not a
# link** — so even once enabled these resolve to repository paths a reader can navigate to, and no
# markup changes to make that happen. Each is a list because two of them are only honest as a pair:
# a claim about human authority is carried by the lookup *and* by the test that pins it.
[source_receipts.subsystems]
reason = ["careloop/agents/"]
facts = ["careloop/provenance/"]
gate = ["careloop/policy/rules.yaml"]
human = ["careloop/state/case.py", "tests/test_approval_capability.py"]
act = ["careloop/tools/"]
verify = ["careloop/graph/verify.py", "tests/test_verify_readback.py"]

# Proof-ledger receipts, keyed by the id the page's EVIDENCE array uses. These *are* rendered as
# links by the existing markup, so once enabled they become clickable pinned URLs.
#
# One path each, because the design gives each ledger row exactly one link. That is why the
# unauthorized-action evidence is split across two rows rather than crammed into one: the document
# that states the result and its limits, and the harness that produces it, are different artifacts
# and each earns its own receipt.
#
# `injection` and `e2e` were unmapped while their labels described measurements nobody had made.
# Session W fixed the labels and made the measurements, so both now point at the script that
# produces them. Two rows sharing one receipt is correct rather than a compromise: one run of
# `verify_lock.py` produces both numbers, and pretending otherwise would invent a second source.
[source_receipts.evidence]
unauthorized = { path = "docs/security-evaluation.md", label = "Read the method" }
injection = { path = "scripts/verify_lock.py", label = "Read the harness" }
mutation = { path = "evals/replay.py", label = "Read the harness" }
readback = { path = "tests/test_verify_readback.py", label = "Read the test" }
e2e = { path = "scripts/verify_lock.py", label = "Read the harness" }
tests = { path = ".github/workflows/ci.yml", label = "Read the CI job" }
